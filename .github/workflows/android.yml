name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publier une release depuis main : version sans le v (ex. 1.0.1). Vide = simple build."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Les noms de fichiers du dépôt contiennent des accents : la JVM doit tourner en UTF-8.
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # création de la release sur un tag v*
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier les données (index.json, objectifs.json)
        run: python3 scripts/check_data.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: SDK Android (API 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            # Lancement manuel avec une version : la release (et son tag) est créée par ce run.
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Une release ne se publie que depuis main (ici : $GITHUB_REF)."
              exit 1
            fi
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Version invalide : « $INPUT_VERSION » (attendu : 1.2.3 ou 1.2.3-beta.1)."
              exit 1
            fi
            name="$INPUT_VERSION"
            tag="v$INPUT_VERSION"
          else
            name="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Lint, tests et APK release
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleRelease

      - name: Renommer l'APK
        id: apk
        run: |
          apk="externat-fmpm-${{ steps.version.outputs.name }}.apk"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$apk"
          echo "file=$apk" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum "$apk" | tee "$apk.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: externat-fmpm-apk
          path: dist/${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Release GitHub (tag v*, ou lancement manuel avec une version)
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          cd dist
          zip_name="externat-fmpm-${VERSION}.zip"
          cp ../android/distribution/README-installation.txt .
          zip -q "$zip_name" "$APK" README-installation.txt
          sha_apk=$(cut -d' ' -f1 "$APK.sha256")
          sha_zip=$(sha256sum "$zip_name" | cut -d' ' -f1)
          # Section « ## [vX.Y.Z] » du CHANGELOG, si elle existe, en tête des notes.
          changes=$(awk -v h="## [v$VERSION]" 'index($0, h) == 1 { f = 1; next } f && /^## / { exit } f && $0 != "---"' ../CHANGELOG.md)
          {
            if [ -n "$changes" ]; then
              echo "## Nouveautés"
              echo "$changes" | sed 's/^### /#### /'
              echo
            fi
            echo "## Téléchargement"
            echo "- \`$APK\` : application Android (7.0 et plus), hors ligne, aucune permission. SHA-256 : \`$sha_apk\`"
            echo "- \`$zip_name\` : l'APK + \`README-installation.txt\` (installation, sources inconnues, mises à jour). SHA-256 : \`$sha_zip\`"
            echo
            echo "Signé avec la clé de release du dépôt (android/signing/) : chaque version s'installe par-dessus la précédente."
            echo
            echo "## Installer ou mettre à jour"
            echo "Ouvrez l'APK sur le téléphone, autorisez l'installation depuis cette source, puis « Installer »."
            echo "Une mise à jour s'installe par-dessus l'ancienne version et garde la checklist (même clé de signature)."
            echo
            echo "## Revenir en arrière"
            echo "Android refuse un versionCode plus ancien : désinstaller (efface la checklist), puis installer l'APK d'une release précédente."
          } > notes.md
          # v1.0.0-beta.1, v1.1.0-rc.1… (tiret = SemVer pré-version) -> pre-release GitHub.
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          # --target : crée le tag sur ce commit s'il n'existe pas encore (lancement manuel).
          gh release create "$TAG" "$APK" "$zip_name" "${prerelease[@]}" --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "Externat FMPM $VERSION" --notes-file notes.md
